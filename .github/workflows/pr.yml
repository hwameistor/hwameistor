name: HwameiStor PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
      - release/v1.0
      - release/v1.1

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.paths.outputs.code }}
      workflows: ${{ steps.paths.outputs.workflows }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify all changed files
        id: paths
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/pr-checks.cjs changes

  workflow-checks:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test release, backport and PR workflow helpers
        run: |
          node --test .github/scripts/*.test.cjs
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check VERSION syntax
        run: node -e "require('./.github/scripts/release.cjs').readVersion(require('node:fs').readFileSync('VERSION', 'utf8'))"
      - name: Install actionlint
        if: needs.changes.outputs.workflows != '[]'
        run: |
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Lint changed workflows
        if: needs.changes.outputs.workflows != '[]'
        env:
          CHANGED_WORKFLOWS: ${{ needs.changes.outputs.workflows }}
        run: node .github/scripts/pr-checks.cjs lint

  unit-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.x'
      - name: Setup smartmontools
        run: sudo apt install smartmontools
      - name: unit-test
        run: make unit-test
  pr-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ["vsphere"]
    timeout-minutes: 180
    steps:
      - name: delete
        run: |
          sudo rm -rf /home/github/_work/hwameistor/hwameistor/_build
          sudo rm -rf /home/github/_work/hwameistor/hwameistor/test/e2e/drbd-adapter/
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Go, gosec, and Run Security Scan
        run: |
          sudo rm -rf /usr/local/go
          wget https://golang.org/dl/go1.22.7.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf go1.22.7.linux-amd64.tar.gz
          export PATH=/usr/local/go/bin:$PATH
          go version
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          export PATH=$(go env GOPATH)/bin:$PATH
          gosec --version
          gosec -severity high -confidence high ./... || exit 1
      - name: pr test
        env:
          E2E_TESTING_LEVEL: "pr-e2e"
        run: make pr-test

  required-checks:
    name: PR checks
    if: always()
    needs: [changes, workflow-checks, unit-test, pr-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Require all applicable checks to succeed
        env:
          PR_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node .github/scripts/pr-checks.cjs gate
