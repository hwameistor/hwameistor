name: Validate release PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-assistant/')
    runs-on: ubuntu-latest
    steps:
      - uses: hwameistor/release-assistant@4c7f281cfb04d202c418fb6e63fa6417bc44817c # Release Assistant
        with:
          command: validate
          target-branch: ${{ github.base_ref }}
          head-ref: ${{ github.head_ref }}
          token: ${{ github.token }}
